name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "feature/*", "develop" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [ published ]

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build & Test for SonarQube ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - profile: sq-10x
            label: "10.8"
          - profile: sq-25x
            label: "25.10"
          - profile: sq-26x
            label: "2026"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          server-id: github

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Unit Tests
        run: mvn test -P ${{ matrix.profile }}

      - name: SonarCloud Analysis with Coverage
        if: matrix.profile == 'sq-26x'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=DomGiorda_sonar-metrics-exporter -P ${{ matrix.profile }}

      - name: Build Package
        run: mvn package -P ${{ matrix.profile }} -DskipTests

      - name: Rename JAR
        run: |
          mv target/sonar-metrics-exporter-*.jar target/sonar-metrics-exporter-sq${{ matrix.label }}.jar

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-sq${{ matrix.label }}
          path: target/sonar-metrics-exporter-sq${{ matrix.label }}.jar

      - name: Deploy to GitHub Packages
        if: github.ref == 'refs/heads/main'
        run: mvn --batch-mode deploy -P ${{ matrix.profile }} -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Publish Release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release_assets
          find artifacts -name "*.jar" -exec cp {} release_assets/ \;
          cp release_assets/sonar-metrics-exporter-sq2026.jar release_assets/sonar-metrics-exporter.jar 2>/dev/null || true
          ls -la release_assets/

      - name: Get project version
        id: get_version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Project version: ${VERSION}"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Release v${{ steps.get_version.outputs.version }}
          files: release_assets/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}